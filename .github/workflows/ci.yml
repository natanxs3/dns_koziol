name: DNS CI
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    paths:
      - 'bind-config/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  strefy:
    name: Strefa ${{ matrix.strefa }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - strefa: koziol.lan
            plik: bind-config/db.koziol.lan
          - strefa: 60.168.192.in-addr.arpa
            plik: bind-config/db.60.168.192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Narzedzia BIND
        run: sudo apt-get update -qq && sudo apt-get install -y bind9-utils
      - name: Skladnia konfiguracji i strefy
        env:
          STREFA: ${{ matrix.strefa }}
          PLIK: ${{ matrix.plik }}
        run: |
          mkdir -p "$RUNNER_TEMP/root/etc/bind" "$RUNNER_TEMP/root/var/cache/bind"
          cp bind-config/* "$RUNNER_TEMP/root/etc/bind/"
          sudo named-checkconf -t "$RUNNER_TEMP/root" /etc/bind/named.conf
          named-checkzone "$STREFA" "$PLIK"
      - name: Kontrola wzrostu numeru SOA
        env:
          PLIK: ${{ matrix.plik }}
        run: python3 .github/scripts/soa.py "$PLIK"
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
  build:
    needs: [strefy, dockerfile]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tagi i ochrona przed nadpisaniem
        id: meta
        env:
          LOGIN: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="$LOGIN/dns_koziol"
          tag="b${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag unikalny przekazywany przez outputs: $tag"
          tags="$image:$tag"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            if docker manifest inspect "$image:$version" >/dev/null 2>&1; then
              echo 'Wersja semantyczna juz istnieje; nie wolno jej nadpisac.'; exit 1
            fi
            tags="$tags,$image:$version"
          else
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            echo 'Ponowienie: wykorzystuje istniejacy obraz bez ponownej publikacji.'
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Budowanie i publikacja
        if: steps.meta.outputs.reuse != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max
  deploy-test:
    needs: build
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: [self-hosted, Linux, X64, test_koziol]
    environment: Testowe
    concurrency:
      group: dns-Testowe
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Wdrozenie i test A PTR SOA
        env:
          OBRAZ: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          DNS_SERVER_IP: ${{ vars.DNS_SERVER_IP }}
        run: bash .github/scripts/deploy_dns.sh
      - name: Weryfikacja przebiegow przez GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            set -x
            hostname -f
            gh run list --repo "$GITHUB_REPOSITORY" --limit 5
            gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          } 2>&1 | tee dowod-testu/github-cli.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-${{ needs.build.outputs.tag }}
          path: dowod-testu/
          retention-days: 90
  deploy-prod:
    needs: [build, deploy-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, prod_koziol]
    environment: Produkcyjne
    concurrency:
      group: dns-Produkcyjne
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Promocja tego samego obrazu i testy
        env:
          OBRAZ: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          DNS_SERVER_IP: ${{ vars.DNS_SERVER_IP }}
        run: bash .github/scripts/deploy_dns.sh
